services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sijebol-prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      # Produksi: migrasi hanya dijalankan scripts/deploy-prod.sh setelah cadangan DB, tidak otomatis saat kontainer mulai.
      - AUTO_MIGRATE=false
    networks:
      - sijebol-network

networks:
  sijebol-network:
    external: true
